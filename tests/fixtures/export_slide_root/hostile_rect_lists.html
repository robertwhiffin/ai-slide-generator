<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; height: 720px; }
      /* collection_passes.html is the BENIGN twin of the hostile_*.html
         fixtures that are it plus one <script> (hostile_collection_passes,
         hostile_range_rects, hostile_rect_lists, hostile_text_nodes).

         Its shape is deliberately NOT the wrapper shape. body's only child
         carries the slide class, so the slide-root locator resolves on its very
         first lookup and never reaches the wrapper collection, so the export
         goes on to the collection reads DOWNSTREAM of the locator, the ones a
         hardened locator cannot help:

           .code            a monospace panel with two child <div>s: element
                            children the snapshot walk visits, each line a
                            text item of its own.
           div.prose        bare inline content in a <div>, whose child nodes
                            the text layout reads. Every deck reaches this one.
           <svg>            an inline svg, a capture target.
           <img> data: svg  an svg data-URI image, a capture target too.

         All four grounds are the slide's own, so the artifact stays a one-colour
         assertion while exercising four separate collection reads. */
      .slide { width: 1280px; height: 720px; padding: 72px 88px; background: #123456;
               color: #ffffff; font-family: Arial, sans-serif; }
      h1 { font-size: 64px; }
      p { font-size: 24px; }
      .prose { font-size: 24px; }
      .code { font-family: monospace; font-size: 20px; }
    </style>
    <script>
      // A byte-identical copy of collection_passes.html plus this <script>, aimed
      // at the box-fragment lists the snapshot engine reads: every word's Range
      // and every inline element's getClientRects() return a DOMRectList, whose
      // length and item() page script can replace on the prototype.
      //
      // length claims a billion rects and item() hands back one far off the
      // slide. The engine reads both through the pristine realm's own getters
      // (dom_access.mjs rectListLength, rectAt), so none of it reaches the
      // deck: the slide exports as its benign twin does, whole.
      var report = { configurable: {}, bites: {}, redefineResult: 'ok' };
      var decoy = { left: 5000, top: 5000, right: 5100, bottom: 5100, width: 100, height: 100, x: 5000, y: 5000 };
      var lengthDescriptor = Object.getOwnPropertyDescriptor(DOMRectList.prototype, 'length');
      var itemDescriptor = Object.getOwnPropertyDescriptor(DOMRectList.prototype, 'item');
      report.configurable['DOMRectList.length'] = !!(lengthDescriptor && lengthDescriptor.configurable);
      report.configurable['DOMRectList.item'] = !!(itemDescriptor && itemDescriptor.configurable);
      try {
        Object.defineProperty(DOMRectList.prototype, 'length', {
          configurable: true,
          get: function () { return 1e9; },
        });
        Object.defineProperty(DOMRectList.prototype, 'item', {
          configurable: true,
          writable: true,
          value: function () { return decoy; },
        });
      } catch (error) {
        report.redefineResult = 'refused DOMRectList: ' + error.message;
      }
      var list = document.documentElement.getClientRects();
      report.bites = { length: list.length === 1e9, item: list.item(0) === decoy };
      document.title = JSON.stringify(report);
    </script>
  </head>
  <body>
    <div class="slide">
      <h1>Acme Collection Passes</h1>
      <div class="prose">Synthetic fixture slide.</div>
      <div class="code">
        <div>SELECT one</div>
        <div>FROM acme</div>
      </div>
      <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="#ffffff"></rect></svg>
      <img width="40" height="40" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Ccircle%20cx='20'%20cy='20'%20r='18'%20fill='%23ffffff'/%3E%3C/svg%3E" />
    </div>
  </body>
</html>
