<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; height: 720px; }
      /* The faithful pinned-template shape: the wrapper rule is the only
         thing that paints the slide ground, and the .slide body carries no
         variant class of its own. Nothing covers the slide, so the exported
         <p:bg> IS the ground the viewer sees — losing it turns this slide
         white.

         This fixture is also what makes the locator test discriminating: a
         locator that resolved to the inner .slide instead of the outermost
         wrapper would read a transparent background and emit white. Only
         resolving to the wrapper yields #123456. */
      section { background: #123456; color: #ffffff; font-family: Arial, sans-serif; }
      .slide { width: 1280px; height: 720px; padding: 72px 88px; }
      h1 { font-size: 64px; }
      p { font-size: 24px; }
    </style>
  </head>
  <body>
    <section data-label="Acme Ground">
      <div class="slide">
        <h1>Acme Wrapper Ground</h1>
        <p>Synthetic fixture slide.</p>
      </div>
    </section>
  </body>
</html>
