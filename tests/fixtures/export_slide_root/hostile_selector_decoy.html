<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; height: 720px; }
      /* The BENIGN twin of the hostile_foreach_* and hostile_selector_decoy
         fixtures: identical but for each of those fixtures' added <script>.

         collection_passes.html drives FOUR of the export's collection reads.
         This one drives a read of every kind of item the export writes, so the
         twin's slide summary holds elements, text, shapes, a table, pictures
         and captures, and a hostile copy that loses any of them shows in its
         counts and its deck. What each element below is in the export:

           .slide            the slide-root ground        -> bgTransferred
           .code             monospace panel, 2 child divs -> a text item per line
           .prose            bare inline text in a <div>   -> a text item
           .tile             div with a background-image    -> a box capture
           <img> data: svg   svg data-URI image             -> a capture
           <svg>             inline svg                     -> a capture
           p.badge           <p> carrying a background      -> a shape under its text
           <table>           one th + one td                -> a native table
           <canvas>          drawn in the shared script     -> a capture
           span.pill         inline element with background  -> a shape under its text

         Every colour is synthetic (#123456 ground, #abcdef accent) and the only
         name is Acme, so nothing here is anyone's brand. */
      .slide { width: 1280px; height: 720px; padding: 72px 88px; background: #123456;
               color: #ffffff; font-family: Arial, sans-serif; }
      h1 { font-size: 48px; }
      p { font-size: 24px; }
      .prose { font-size: 24px; }
      .code { font-family: monospace; font-size: 20px; }
      /* A url() background, which no shape can paint, so the export captures
         the box. Kept a data: URI so the fixture never touches the network. */
      .tile { width: 60px; height: 60px;
              background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEUlEQVR4nGNYffY9VsQwtCQAAkyZwR/tUEcAAAAASUVORK5CYII="); }
      .badge { background: #abcdef; color: #123456; padding: 4px; }
      table { border-collapse: collapse; }
      th, td { border: 1px solid #abcdef; padding: 6px; font-size: 20px; }
      .pill { background: #abcdef; color: #123456; padding: 2px 8px; }
    </style>
    <script>
      // Poisoned Document.prototype.querySelector -> a detached decoy.
      //
      // The slide-root locator's two direct lookups (`body > [class*="slide"]`
      // and the `body > div` fallback) go through this accessor, which is a
      // CONFIGURABLE own property like every other. A decoy answering them is
      // not a hang and not a throw: the pass returns 'solid' and transfers the
      // DECOY's ground, so the deck exports a colour that appears nowhere in it.
      // The decoy's #654321 is deliberately not the slide's #123456 so the body
      // background says which element actually answered.
      // Reported on document.title so the suite can prove the poisoning TOOK
      // before asserting anything else — a poisoning the browser refused would
      // make every expectation vacuous.
      var decoy = document.createElement('div');
      decoy.className = 'slide';
      decoy.style.background = '#654321';
      var report = { configurable: {}, direct: {}, redefineResult: 'ok' };
      function poisonQuerySelector(name, proto) {
        var descriptor = Object.getOwnPropertyDescriptor(proto, 'querySelector');
        report.direct[name] = !!descriptor;
        report.configurable[name] = descriptor ? !!descriptor.configurable : true;
        try {
          Object.defineProperty(proto, 'querySelector', {
            configurable: true,
            value: function () { return decoy; },
          });
        } catch (error) {
          report.redefineResult = 'refused ' + name + ': ' + error.message;
        }
      }
      poisonQuerySelector('Document', Document.prototype);
      document.title = JSON.stringify(report);
    </script>
  </head>
  <body>
    <div class="slide">
      <h1>Acme Every Collection Pass</h1>
      <div class="prose">Synthetic fixture slide.</div>
      <div class="code">
        <div>SELECT one</div>
        <div>FROM acme</div>
      </div>
      <div class="tile"></div>
      <img width="40" height="40" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Ccircle%20cx='20'%20cy='20'%20r='18'%20fill='%23ffffff'/%3E%3C/svg%3E" />
      <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="#ffffff"></rect></svg>
      <p class="badge">Acme badge</p>
      <table>
        <tr><th>Acme head</th><td>Acme cell</td></tr>
      </table>
      <canvas id="acme-canvas" width="80" height="40"></canvas>
      <p>Acme prose with a <span class="pill">pill</span> inside.</p>
    </div>
    <script>
      // Shared by every twin: a drawn canvas, so the export's canvas wait
      // (render_slide.cjs waitForCanvases) has a canvas to settle, and its
      // capture holds both colours drawn here.
      (function () {
        var canvas = document.getElementById('acme-canvas');
        var ctx = canvas && canvas.getContext && canvas.getContext('2d');
        if (!ctx) return;
        ctx.fillStyle = '#abcdef';
        ctx.fillRect(0, 0, 80, 40);
        ctx.fillStyle = '#123456';
        ctx.fillRect(8, 8, 30, 24);
      })();
    </script>
  </body>
</html>
