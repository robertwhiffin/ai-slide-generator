<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; height: 720px; }
      /* The BENIGN twin of the hostile_foreach_* and hostile_selector_decoy
         fixtures: identical but for each of those fixtures' added <script>.

         collection_passes.html drives FOUR of the preprocess pass's collection
         reads. This one drives EVERY one of them, because the raw-accessor
         defect is spread across ten sub-passes and a fixture that leaves any of
         them at zero cannot attribute a regression to the site that caused it.
         Each element below is the sole reason one count is non-zero:

           .slide            the slide-root ground        -> bgTransferred
           .code             monospace panel, 2 child divs -> codeBlocks
           .prose            bare inline text in a <div>   -> wrapped
           .tile             div with a background-image    -> replacedImgs
           <img> data: svg   svg data-URI image             -> svgImgsRasterized
           <svg>             inline svg                     -> inlineSvgsRasterized
           p.badge           <p> carrying a background      -> peeledTextTags
           <table>           one th + one td                -> tableCells
           <canvas>          drawn in the shared script     -> canvasImgs
           span.pill         inline element with background  -> inlineBgs

         Every colour is synthetic (#123456 ground, #abcdef accent) and the only
         name is Acme, so nothing here is anyone's brand. */
      .slide { width: 1280px; height: 720px; padding: 72px 88px; background: #123456;
               color: #ffffff; font-family: Arial, sans-serif; }
      h1 { font-size: 48px; }
      p { font-size: 24px; }
      .prose { font-size: 24px; }
      .code { font-family: monospace; font-size: 20px; }
      /* A non-gradient url() background: the one shape replaceBackgroundImageWithImg
         acts on. Kept a data: URI so the fixture never touches the network, and
         base64 PNG rather than inline SVG because that pass matches the url with
         [^"')]+ — the quotes an svg+xml payload carries would end the match early
         and leave this count at zero. */
      .tile { width: 60px; height: 60px;
              background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEUlEQVR4nGNYffY9VsQwtCQAAkyZwR/tUEcAAAAASUVORK5CYII="); }
      .badge { background: #abcdef; color: #123456; padding: 4px; }
      table { border-collapse: collapse; }
      th, td { border: 1px solid #abcdef; padding: 6px; font-size: 20px; }
      .pill { background: #abcdef; color: #123456; padding: 2px 8px; }
    </style>
    <script>
      // NodeList.prototype[Symbol.iterator] made to STALL — the canvas
      // preflight's SECOND read, which is a different property from the first.
      //
      // The preflight's readiness check builds an array with Array.from() over
      // the lookup's result, and Array.from reads [Symbol.iterator] off the
      // collection. So a document that leaves querySelectorAll entirely alone
      // still reaches into the preflight here. This is the vector ef67a38 closed
      // across the preprocess pass; the preflight was never covered by it,
      // because the preflight runs before that pass is evaluated into the page.
      //
      // Only NodeList is poisoned, not HTMLCollection: the preflight's Array.from
      // consumes a querySelectorAll result, which is a NodeList. Keeping the
      // poisoning to the one interface that read actually consumes is what makes
      // a pass attributable to this call site rather than to any other.
      //
      // Poisoning by DELAY rather than by an endless iterator is deliberate. An
      // iterator that never reports done makes Array.from grow an array without
      // bound, so the renderer dies of allocation instead of stalling, and the
      // export then fails for a reason that is not the one under test. A stall
      // that ends also lets an orphaned renderer exit once the wrapper has killed
      // node, instead of spinning on the machine forever. The real defect is
      // unbounded; this fixture is strictly weaker than it, and only in duration.
      //
      // Reported on document.title so the suite can prove the poisoning TOOK
      // before asserting anything else — a poisoning the browser refused would
      // make every expectation vacuous.
      var STALL_MS = 60000;
      var realIterator = NodeList.prototype[Symbol.iterator];
      var report = { configurable: {}, direct: {}, redefineResult: 'ok' };
      function poisonIterator(name, proto) {
        var descriptor = Object.getOwnPropertyDescriptor(proto, Symbol.iterator);
        // No own [Symbol.iterator] does not mean not poisonable — an own property
        // defined here shadows whatever was inherited — so configurability is
        // only reported when there is a direct one to report.
        report.direct[name] = !!descriptor;
        report.configurable[name] = descriptor ? !!descriptor.configurable : true;
        try {
          Object.defineProperty(proto, Symbol.iterator, {
            configurable: true,
            value: function () {
              var until = Date.now() + STALL_MS;
              while (Date.now() < until) { /* occupy the main thread */ }
              return realIterator.call(this);
            },
          });
        } catch (error) {
          report.redefineResult = 'refused ' + name + ': ' + error.message;
        }
      }
      poisonIterator('NodeList', NodeList.prototype);
      document.title = JSON.stringify(report);
    </script>
  </head>
  <body>
    <div class="slide">
      <h1>Acme Every Collection Pass</h1>
      <div class="prose">Synthetic fixture slide.</div>
      <div class="code">
        <div>SELECT one</div>
        <div>FROM acme</div>
      </div>
      <div class="tile"></div>
      <img width="40" height="40" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Ccircle%20cx='20'%20cy='20'%20r='18'%20fill='%23ffffff'/%3E%3C/svg%3E" />
      <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="#ffffff"></rect></svg>
      <p class="badge">Acme badge</p>
      <table>
        <tr><th>Acme head</th><td>Acme cell</td></tr>
      </table>
      <canvas id="acme-canvas" width="80" height="40"></canvas>
      <p>Acme prose with a <span class="pill">pill</span> inside.</p>
    </div>
    <script>
      // Shared by every twin: rasterizeCanvases() skips a canvas whose
      // toDataURL() is under 200 chars, which a never-drawn canvas always is.
      // Drawing two synthetic rects is the least that makes the pass reach it.
      (function () {
        var canvas = document.getElementById('acme-canvas');
        var ctx = canvas && canvas.getContext && canvas.getContext('2d');
        if (!ctx) return;
        ctx.fillStyle = '#abcdef';
        ctx.fillRect(0, 0, 80, 40);
        ctx.fillStyle = '#123456';
        ctx.fillRect(8, 8, 30, 24);
      })();
    </script>
  </body>
</html>
