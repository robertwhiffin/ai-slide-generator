<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; height: 720px; }
      /* collection_passes.html is the BENIGN twin of the hostile_*.html
         fixtures that are it plus one <script> (hostile_collection_passes,
         hostile_range_rects, hostile_rect_lists, hostile_text_nodes).

         Its shape is deliberately NOT the wrapper shape. body's only child
         carries the slide class, so the slide-root locator resolves on its very
         first lookup and never reaches the wrapper collection, so the export
         goes on to the collection reads DOWNSTREAM of the locator, the ones a
         hardened locator cannot help:

           .code            a monospace panel with two child <div>s: element
                            children the snapshot walk visits, each line a
                            text item of its own.
           div.prose        bare inline content in a <div>, whose child nodes
                            the text layout reads. Every deck reaches this one.
           <svg>            an inline svg, a capture target.
           <img> data: svg  an svg data-URI image, a capture target too.

         All four grounds are the slide's own, so the artifact stays a one-colour
         assertion while exercising four separate collection reads. */
      .slide { width: 1280px; height: 720px; padding: 72px 88px; background: #123456;
               color: #ffffff; font-family: Arial, sans-serif; }
      h1 { font-size: 64px; }
      p { font-size: 24px; }
      .prose { font-size: 24px; }
      .code { font-family: monospace; font-size: 20px; }
    </style>
    <script>
      // A byte-identical copy of collection_passes.html plus this <script>, aimed
      // at the snapshot engine's TEXT walk, which reads child NODES (text included)
      // rather than child elements, and reads each text node's characters.
      //
      // Every node-level read that walk could make through this realm is
      // replaced:
      //   firstChild, nextSibling  return the node itself: a sibling walk that
      //                            trusts them never ends, and a descent never
      //                            reaches a real child;
      //   nodeType                 is 3 for every node, so every element would
      //                            pass for a text node;
      //   childNodes               is {length: 1e9}: an index loop that trusts it
      //                            runs a billion steps over nothing;
      //   textContent, data        return a decoy, so text read through them is
      //                            not the slide's.
      // The export must read the real tree and the real text regardless, so the
      // deck exports exactly as its benign twin does.
      var DECOY = 'decoy text planted by a hostile realm';
      var report = { configurable: {}, bites: {}, redefineResult: 'ok' };
      function poison(proto, protoName, name, get) {
        var descriptor = Object.getOwnPropertyDescriptor(proto, name);
        report.configurable[protoName + '.' + name] = !!(descriptor && descriptor.configurable);
        try {
          Object.defineProperty(proto, name, { configurable: true, get: get });
        } catch (error) {
          report.redefineResult = 'refused ' + name + ': ' + error.message;
        }
      }
      poison(Node.prototype, 'Node', 'firstChild', function () { return this; });
      poison(Node.prototype, 'Node', 'nextSibling', function () { return this; });
      poison(Node.prototype, 'Node', 'nodeType', function () { return 3; });
      poison(Node.prototype, 'Node', 'childNodes', function () { return { length: 1e9 }; });
      poison(Node.prototype, 'Node', 'textContent', function () { return DECOY; });
      poison(CharacterData.prototype, 'CharacterData', 'data', function () { return DECOY; });
      // What a reader of this realm now sees, so the suite can prove each
      // replacement took effect rather than assume it.
      var sample = document.createTextNode('real text');
      var root = document.documentElement;
      report.bites = {
        firstChild: root.firstChild === root,
        nextSibling: root.nextSibling === root,
        nodeType: root.nodeType === 3,
        childNodes: root.childNodes.length === 1e9,
        textContent: root.textContent === DECOY,
        data: sample.data === DECOY,
      };
      document.title = JSON.stringify(report);
    </script>
  </head>
  <body>
    <div class="slide">
      <h1>Acme Collection Passes</h1>
      <div class="prose">Synthetic fixture slide.</div>
      <div class="code">
        <div>SELECT one</div>
        <div>FROM acme</div>
      </div>
      <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="#ffffff"></rect></svg>
      <img width="40" height="40" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Ccircle%20cx='20'%20cy='20'%20r='18'%20fill='%23ffffff'/%3E%3C/svg%3E" />
    </div>
  </body>
</html>
