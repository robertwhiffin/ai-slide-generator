<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; height: 720px; }
      /* Byte-for-byte the same style sheet as wrapped_dark.html: only the
         <section> wrapper differs, so any background difference between the
         two exports is attributable to the wrapper alone. */
      section, .slide.dark { background: #123456; }
      section, .slide { color: #ffffff; font-family: Arial, sans-serif; }
      .slide { width: 1280px; height: 720px; padding: 72px 88px; }
      h1 { font-size: 64px; }
      p { font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="slide dark">
      <h1>Acme Quarterly Overview</h1>
      <p>Synthetic fixture slide.</p>
    </div>
  </body>
</html>
