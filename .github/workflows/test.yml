name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Determine which test suites to run based on changed files
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      packages: ${{ steps.filter.outputs.packages }}
      api: ${{ steps.filter.outputs.api }}
      export: ${{ steps.filter.outputs.export }}
      streaming: ${{ steps.filter.outputs.streaming }}
      config: ${{ steps.filter.outputs.config }}
      slides: ${{ steps.filter.outputs.slides }}
      genie: ${{ steps.filter.outputs.genie }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # NOTE: `backend` includes `frontend/tests/**` so that a
            # frontend-tests-only PR (e.g. a new E2E spec) also runs the backend
            # unit tests and all seven integration jobs — they all gate on
            # `backend`. This coupling is intentional: E2E spec files import
            # backend fixtures, and integration guards (test_ci_collects_integration_tests,
            # test_e2e_matrix_covers_specs) live in tests/unit.
            backend:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/test.yml'
              - 'frontend/tests/**'
            frontend:
              - 'frontend/**'
            packages:
              - 'packages/**'
              - 'frontend/**'
              - 'src/**'
              - 'pyproject.toml'
            api:
              - 'src/api/**'
              - 'tests/integration/test_api_routes.py'
            export:
              - 'src/api/routes/export.py'
              - 'src/api/services/export*.py'
              - 'src/core/pptx_export.py'
              - 'tests/integration/test_export.py'
            streaming:
              - 'src/api/routes/chat.py'
              - 'src/api/services/chat*.py'
              - 'src/core/agent*.py'
              - 'tests/integration/test_streaming.py'
            config:
              - 'src/api/routes/settings/**'
              - 'src/api/routes/agent_config.py'
              - 'src/api/routes/profiles.py'
              - 'src/api/routes/tools.py'
              - 'src/api/schemas/agent_config.py'
              - 'src/services/config*.py'
              - 'src/database/**'
              - 'tests/unit/test_agent_config_routes.py'
              - 'tests/unit/test_profiles_routes.py'
              - 'tests/unit/test_tools_routes.py'
            slides:
              - 'src/core/slide*.py'
              - 'src/api/routes/slides.py'
              - 'tests/integration/test_slide*.py'
            genie:
              - 'src/core/genie*.py'
              - 'src/tools/genie*.py'
              - 'tests/integration/test_genie*.py'

  # Fast unit tests - always run, gate for other tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short -n auto \
            --junitxml=test-results/unit-results.xml \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # Integration test: API Routes
  integration-api-routes:
    name: "Integration: API Routes"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run API routes tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          pytest tests/integration/test_api_routes.py -v --tb=short \
            --junitxml=test-results/api-routes-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-api-routes-results
          path: test-results/

  # Integration test: Config API
  integration-config-api:
    name: "Integration: Config API"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.config == 'true' || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run config API tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          pytest tests/unit/test_agent_config_routes.py \
            tests/unit/test_profiles_routes.py \
            tests/unit/test_tools_routes.py \
            tests/unit/test_agent_config_schema.py \
            -v --tb=short \
            --log-cli-level=WARNING -s \
            --junitxml=test-results/config-api-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-config-api-results
          path: test-results/

  # Integration test: Export
  integration-export:
    name: "Integration: Export"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.export == 'true' || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run export tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          pytest tests/integration/test_export.py -v --tb=short \
            --junitxml=test-results/export-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-export-results
          path: test-results/

  # Integration test: Streaming
  integration-streaming:
    name: "Integration: Streaming"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.streaming == 'true' || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run streaming tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          pytest tests/integration/test_streaming.py -v --tb=short \
            --junitxml=test-results/streaming-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-streaming-results
          path: test-results/

  # Integration test: Slides
  integration-slides:
    name: "Integration: Slides"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.slides == 'true' || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run slide tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          pytest tests/integration/test_slide_deck_integration.py tests/integration/test_slide_replacement_flow.py \
            -v --tb=short --junitxml=test-results/slides-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-slides-results
          path: test-results/

  # Integration test: LangGraph orchestration (ws4c layer 1)
  #
  # Cloned from integration-slides (Ruling C-16): the same Postgres service, the
  # same DATABASE_URL/ENVIRONMENT env, -m "not live", and a junit artifact.
  #
  # It needs a job of its own.  unit-tests collects tests/unit wholesale, but
  # every integration job names FILES, so a new file under tests/integration/
  # would run NOWHERE; ws4e's layer-4 job filters -k layer4, which excludes this
  # suite by construction; and integration-general has no Postgres and blanks
  # DATABRICKS_HOST/TOKEN deliberately.  Parking these tests anywhere else leaves
  # ws4c's headline DoD unverifiable in CI.
  #
  # Name every file of this suite explicitly in the run: block below —
  # tests/unit/test_ci_collects_integration_tests.py fails otherwise
  # (DELIBERATE_EXCLUSIONS is empty, and stays that way).
  integration-graph:
    name: "Integration: Graph Orchestration"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run graph orchestration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          pytest tests/integration/test_graph_orchestration.py \
            tests/integration/test_graph_mode_turn.py \
            tests/integration/test_spec_dirty_marker_routes.py \
            tests/integration/test_sweeper_describe_only.py \
            -v --tb=short --junitxml=test-results/graph-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-graph-results
          path: test-results/

  # Integration test: Genie
  integration-genie:
    name: "Integration: Genie"
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.genie == 'true' || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run Genie tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.cloud.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          # Exit code 5 means no tests collected (all deselected) - treat as success
          # These files currently only contain 'live' tests requiring real Databricks
          pytest tests/integration/test_genie_integration.py tests/integration/test_client_integration.py \
            -v --tb=short --junitxml=test-results/genie-results.xml -m "not live" \
            || test $? -eq 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-genie-results
          path: test-results/

  # Integration test: General (previously-uncollected orphan files)
  # All ten files use SQLite in-memory or FastAPI TestClient — no Postgres needed.
  integration-general:
    name: "Integration: General"
    runs-on: ubuntu-latest
    # Backstop: the measured baseline is ~18 s for all ten files. 15 minutes is
    # far above that but far below GitHub's 6-hour default, so a future
    # regression that re-introduces the SCIM-retry hang fails fast instead of
    # burning the runner for hours.
    timeout-minutes: 15
    needs: [changes, unit-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run general integration tests
        env:
          ENVIRONMENT: test
          # IMPORTANT: these must be empty strings, NOT fake values like
          # "https://test.cloud.databricks.com". A non-empty but unreachable host
          # puts the identity provider into WORKSPACE mode via get_system_client()
          # (databricks_client.py), and the first SCIM call against that host then
          # retries until the job dies (measured: >60 s each for four of these ten
          # tests). Empty credentials make WorkspaceClient() construction raise,
          # which _determine_mode() catches and falls back to LOCAL identity — no
          # SCIM call, no retries, all ten tests finish in ~18 s total.
          DATABRICKS_HOST: ""
          DATABRICKS_TOKEN: ""
        run: |
          pytest \
            tests/integration/test_comments_removed.py \
            tests/integration/test_export_parity.py \
            tests/integration/test_get_slide_deck_row_read.py \
            tests/integration/test_image_api.py \
            tests/integration/test_mcp_endpoint.py \
            tests/integration/test_request_logging.py \
            tests/integration/test_save_slide_deck_dual_write.py \
            tests/integration/test_savepoint_e2e.py \
            tests/integration/test_slide_row_identity_and_verdicts.py \
            tests/integration/test_task7_verification_and_restore.py \
            tests/integration/test_ws4b_fixture_contracts.py \
            -v --tb=short --junitxml=test-results/general-results.xml -m "not live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-general-results
          path: test-results/

  # Frontend build check - catches TypeScript errors before E2E
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc -b

      - name: Vite production build
        working-directory: frontend
        run: npx vite build

  # Frontend unit tests (vitest) - separate from frontend-build so a type-check
  # failure and a unit-test failure surface independently.  Does NOT block the
  # e2e matrix (e2e-tests needs frontend-build, not this job).
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest unit tests
        working-directory: frontend
        run: npm run test:unit

  # Wheel build check - verifies both packages build successfully
  wheel-build:
    name: Wheel Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: pip install build

      - name: Build databricks-tellr wheel
        run: python -m build packages/databricks-tellr --outdir dist/

      - name: Build databricks-tellr-app wheel
        run: python -m build packages/databricks-tellr-app --outdir dist/

      - name: Verify wheels
        run: |
          echo "Built wheels:"
          ls -lh dist/*.whl
          pip install --dry-run dist/databricks_tellr-*.whl
          pip install --dry-run dist/databricks_tellr_app-*.whl

  # E2E tests with Playwright - run each test file in isolation
  e2e-tests:
    name: E2E - ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: [changes, unit-tests, frontend-build]
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      needs.frontend-build.result == 'success' &&
      needs.changes.outputs.frontend == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        test:
          - admin-page
          - admin-route-gate
          - agent-config-integration
          - api-route-matcher
          - chat-ui
          - css-bg-export
          - deck-integrity
          - deck-prompts-integration
          - deck-prompts-ui
          - design-system-brand-text-uncapped
          - design-system-selector
          - design-systems-ui
          - export-csp
          - export-ui
          - help-ui
          - history-integration
          - history-ui
          - inline-svg-records-export
          - presentation-mode
          - profile-ui
          - profiles-integration
          - session-config-isolation
          - session-loading
          - slide-operations-ui
          - slide-security
          - slide-styles-integration
          - slide-styles-ui
          - slide-surface-fidelity
          - slide-viewer
          - stale-session-recovery
          - style-source-exclusivity
          - svg-raster-export
          - template-cards
          - template-preview-import-scan
          - template-viewer
          - viewer-readonly
    
    # Use PostgreSQL for E2E tests - matches production and handles concurrency well
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Seed database with default data
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          echo "Initializing database tables and seeding default data..."
          python -c "
          from src.core.database import init_db, get_db_session
          from src.core.init_default_profile import seed_defaults
          from src.database.models import ConfigProfile, ConfigPrompts, SlideStyleLibrary, UserSession
          import uuid
          
          # Create tables
          init_db()
          print('Tables created')
          
          # Seed deck prompts and slide styles (no Genie config required)
          seed_defaults()
          print('Default deck prompts and slide styles seeded')
          
          # Create a minimal default profile for E2E tests
          with get_db_session() as db:
              # Check if profile already exists
              existing = db.query(ConfigProfile).filter_by(name='default').first()
              if not existing:
                  # Get the first slide style
                  style = db.query(SlideStyleLibrary).first()
                  style_id = style.id if style else None
                  
                  # Create profile
                  profile = ConfigProfile(
                      name='default',
                      description='Default test profile',
                      is_default=True
                  )
                  db.add(profile)
                  db.flush()
                  
                  # Create prompts config
                  prompts = ConfigPrompts(
                      profile_id=profile.id,
                      selected_slide_style_id=style_id
                  )
                  db.add(prompts)
                  
                  db.commit()
                  print(f'Created default profile (id={profile.id})')
              else:
                  profile = existing
                  print('Default profile already exists')
              
              # Create a test session for history tests
              existing_session = db.query(UserSession).first()
              if not existing_session:
                  session = UserSession(
                      session_id=str(uuid.uuid4()),
                      user_id='system',
                      title='Seeded Test Session',
                  )
                  db.add(session)
                  db.commit()
                  print(f'Created test session (id={session.session_id})')
              else:
                  print('Test session already exists')

          # Populate agent_config on the seeded profiles, exactly as the app used
          # to on startup. Migrations now run once pre-fork in
          # run.py::init_database, never in the uvicorn workers this job launches,
          # so the seed step must run migrate_profiles itself — otherwise the
          # seeded 'default' profile keeps a NULL agent_config and collides with
          # save-from-session's duplicate-config check.
          from src.core.database import get_session_local
          from src.core.migrate_profiles_to_agent_config import migrate_profiles, backfill_sessions
          migrated = migrate_profiles(get_session_local())
          backfill_sessions(get_session_local())
          print(f'Migrated {migrated} profiles to agent_config')
          "

      - name: Verify database seeding
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ENVIRONMENT: test
          DATABRICKS_HOST: https://test.databricks.com
          DATABRICKS_TOKEN: test-token
        run: |
          echo "Verifying database state..."
          python -c "
          from src.core.database import get_db_session
          from src.database.models import ConfigProfile, SlideStyleLibrary, SlideDeckPromptLibrary, UserSession
          
          with get_db_session() as db:
              profiles = db.query(ConfigProfile).all()
              styles = db.query(SlideStyleLibrary).all()
              prompts = db.query(SlideDeckPromptLibrary).all()
              sessions = db.query(UserSession).all()
              
              print(f'Profiles: {len(profiles)}')
              for p in profiles:
                  print(f'  - {p.name} (id={p.id}, is_default={p.is_default})')
              
              print(f'Slide Styles: {len(styles)}')
              for s in styles:
                  print(f'  - {s.name} (id={s.id})')
              
              print(f'Deck Prompts: {len(prompts)}')
              for d in prompts:
                  print(f'  - {d.name} (id={d.id})')
              
              print(f'Sessions: {len(sessions)}')
              for s in sessions:
                  print(f'  - {s.title} (session_id={s.session_id})')
              
              if len(profiles) == 0:
                  raise Exception('No profiles found - seeding failed!')
              if len(styles) == 0:
                  raise Exception('No slide styles found - seeding failed!')
              if len(sessions) == 0:
                  raise Exception('No sessions found - seeding failed!')
          "

      - name: Start backend server
        run: |
          DATABASE_URL="postgresql://test:test@localhost:5432/test_db" \
          ENVIRONMENT="test" \
          DATABRICKS_HOST="https://test.databricks.com" \
          DATABRICKS_TOKEN="test-token" \
          python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Backend failed to start"
              exit 1
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done

      - name: Verify API endpoints work
        run: |
          echo "Testing API endpoints..."
          echo "--- Health check ---"
          curl -s http://localhost:8000/api/health | head -c 200
          echo ""
          echo "--- Profiles API ---"
          curl -s --max-time 10 http://localhost:8000/api/settings/profiles | head -c 500
          echo ""
          echo "--- Deck Prompts API ---"
          curl -s --max-time 10 http://localhost:8000/api/settings/deck-prompts | head -c 500
          echo ""
          echo "--- Slide Styles API ---"
          curl -s --max-time 10 http://localhost:8000/api/settings/slide-styles | head -c 500
          echo ""
          echo "--- Sessions API ---"
          curl -s --max-time 10 http://localhost:8000/api/sessions | head -c 500
          echo ""
          echo "API verification complete"

      - name: Debug API from frontend context
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          echo "=== Debug: Testing API connectivity from frontend dev server context ==="
          echo ""
          echo "--- Test 1: Direct curl to 127.0.0.1:8000 ---"
          curl -v --max-time 10 http://127.0.0.1:8000/api/settings/profiles 2>&1 | head -50
          echo ""
          echo "--- Test 2: Direct curl to localhost:8000 ---"
          curl -v --max-time 10 http://localhost:8000/api/settings/profiles 2>&1 | head -50
          echo ""
          echo "--- Test 3: Check sessions API (known working) ---"
          curl -v --max-time 10 http://127.0.0.1:8000/api/sessions 2>&1 | head -50
          echo ""
          echo "--- Test 4: Network interfaces ---"
          ip addr 2>/dev/null || ifconfig 2>/dev/null || echo "Cannot get network info"
          echo ""
          echo "--- Test 5: Port 8000 listeners ---"
          ss -tlnp 2>/dev/null | grep 8000 || netstat -tlnp 2>/dev/null | grep 8000 || echo "Cannot get port info"
          echo ""
          echo "=== End Debug ==="

      - name: Run E2E tests - ${{ matrix.test }}
        working-directory: frontend
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          echo "=== Pre-flight backend check ==="
          echo "Checking 127.0.0.1:8000..."
          curl -s --max-time 5 http://127.0.0.1:8000/api/health || echo "127.0.0.1:8000 FAILED"
          echo ""
          echo "Checking backend process..."
          ps aux | grep uvicorn | grep -v grep || echo "No uvicorn process found"
          echo "=== End pre-flight check ==="
          echo ""
          echo "Running test: ${{ matrix.test }}.spec.ts"
          npx playwright test tests/e2e/${{ matrix.test }}.spec.ts --project=chromium --workers=1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.test }}
          path: frontend/playwright-report/

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.test }}
          path: frontend/test-results/

  # Summary job - runs after all tests
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - frontend-build
      - frontend-unit-tests
      - wheel-build
      - integration-api-routes
      - integration-config-api
      - integration-export
      - integration-streaming
      - integration-slides
      - integration-graph
      - integration-genie
      - integration-general
      - e2e-tests
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Wheel Build: ${{ needs.wheel-build.result }}"
          echo "API Routes: ${{ needs.integration-api-routes.result }}"
          echo "Config API: ${{ needs.integration-config-api.result }}"
          echo "Export: ${{ needs.integration-export.result }}"
          echo "Streaming: ${{ needs.integration-streaming.result }}"
          echo "Slides: ${{ needs.integration-slides.result }}"
          echo "Graph Orchestration: ${{ needs.integration-graph.result }}"
          echo "Genie: ${{ needs.integration-genie.result }}"
          echo "General Integration: ${{ needs.integration-general.result }}"
          echo "E2E: ${{ needs.e2e-tests.result }}"

          # Fail if any required job failed (not skipped)
          failed=false
          for result in "${{ needs.unit-tests.result }}" \
                        "${{ needs.frontend-build.result }}" \
                        "${{ needs.frontend-unit-tests.result }}" \
                        "${{ needs.wheel-build.result }}" \
                        "${{ needs.integration-api-routes.result }}" \
                        "${{ needs.integration-config-api.result }}" \
                        "${{ needs.integration-export.result }}" \
                        "${{ needs.integration-streaming.result }}" \
                        "${{ needs.integration-slides.result }}" \
                        "${{ needs.integration-graph.result }}" \
                        "${{ needs.integration-genie.result }}" \
                        "${{ needs.integration-general.result }}" \
                        "${{ needs.e2e-tests.result }}"; do
            if [ "$result" == "failure" ]; then
              failed=true
              break
            fi
          done

          if [ "$failed" == "true" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed or were skipped!"
