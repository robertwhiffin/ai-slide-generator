name: Publish to Test PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 dev version to publish, e.g. 0.3.9.dev3"
        required: true
        type: string

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: pip install build

      - name: Stamp version into both pyproject.toml files
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["INPUT_VERSION"]
          paths = [
              pathlib.Path("packages/databricks-tellr/pyproject.toml"),
              pathlib.Path("packages/databricks-tellr-app/pyproject.toml"),
          ]
          for path in paths:
              text = path.read_text()
              # Replace the first `version = "..."` line (the [project] version).
              new_text, count = re.subn(
                  r'(?m)^version\s*=\s*".*"$',
                  f'version = "{version}"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      f"ERROR: expected exactly one version line in {path}, replaced {count}"
                  )
              path.write_text(new_text)
              stamped = tomllib.loads(path.read_text())["project"]["version"]
              print(f"Stamped version = {stamped} into {path}")
          PY

      - name: Build databricks-tellr
        run: python -m build --sdist --wheel packages/databricks-tellr

      - name: Build huashu bootstrap artifacts
        # Produces services/pptx-emit-huashu/{node_modules,sys-libs-bullseye}.tar.gz
        # which setup.py copies into the wheel's _assets/sidecars/pptx-emit-huashu/
        # when TELLR_INCLUDE_HUASHU_SIDECAR=1. Mirrors publish.yml (prod).
        run: bash services/pptx-emit-huashu/build-artifacts.sh

      - name: Build databricks-tellr-app
        run: |
          cp -r src packages/databricks-tellr-app/src
          TELLR_INCLUDE_HUASHU_SIDECAR=1 python -m build --sdist --wheel packages/databricks-tellr-app
          rm -rf packages/databricks-tellr-app/src

      - name: Verify built artifacts (huashu tarballs and sidecar sources present, wheel >= 25MB)
        run: |
          # The tarballs, setup.sh and every sidecar source file the export
          # loads (its require/import graph from emit_deck.mjs, read inside the
          # wheel), and the 25MB floor. The export loads its sources only when it
          # runs, so a missing one would pass the build and fail every export.
          python scripts/verify_app_wheel.py packages/databricks-tellr-app/dist

      - name: Upload tellr dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-tellr
          path: packages/databricks-tellr/dist/

      - name: Upload tellr-app dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-tellr-app
          path: packages/databricks-tellr-app/dist/

  publish-tellr:
    name: Publish databricks-tellr to Test PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-tellr
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-tellr-app:
    name: Publish databricks-tellr-app to Test PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-tellr-app
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Write deploy summary
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Published to Test PyPI"
            echo ""
            echo "**Package:** \`databricks-tellr-app\`"
            echo "**Version:** \`${INPUT_VERSION}\`"
            echo ""
            echo "### Consume it"
            echo ""
            echo "Deploy the app against this version with:"
            echo ""
            echo '```bash'
            echo "./scripts/deploy_local.sh update --env <env> --profile <profile> --from-test-pypi ${INPUT_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
